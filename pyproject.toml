[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codereview-skillbench"
version = "0.1.0b1"
description = "Evidence-backed evaluation for Code Review Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]
openai = ["openai>=1.99,<3"]

[project.scripts]
skillbench = "skillbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillbench"]

[tool.pytest.ini_options]
testpaths = ["tests/public", "backend/tests"]

